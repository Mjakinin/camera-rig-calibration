name: Pipeline contracts

on:
  pull_request:
    paths:
      - "run/rigcal.py"
      - "src/camera_rig_calibration/**"
      - "src/calib_lab/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/pipeline-contracts.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rigcal and test dependencies
        run: python -m pip install -e ".[dev,scientific,standalone]"

      - name: Test rigcal contracts without running calibration methods
        run: pytest -m "not slow and not requires_colmap and not requires_ros"

      - name: Compile the maintained Python source tree
        run: python -m compileall -q src/camera_rig_calibration run/rigcal.py
