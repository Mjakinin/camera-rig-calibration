name: Pipeline contracts

on:
  pull_request:
    paths:
      - "run/bus_real_data/**"
      - ".github/workflows/pipeline-contracts.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Python runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-numpy python3-scipy python3-opencv python3-yaml

      - name: Compile modified Python entry points
        run: |
          python3 -m py_compile \
            run/bus_real_data/_shared/baseline/04_attach_camera_models_to_observations.py \
            run/bus_real_data/approach1_marker_direct_relay/12_estimate_colmap_scale_from_aruco_resolution_aware.py \
            run/bus_real_data/approach1_marker_direct_relay/13_eval_direct_static_cam3_cam1_multimarker_resolution_aware.py \
            run/bus_real_data/approach1_marker_direct_relay/14_eval_moving_relay_chains_resolution_aware.py \
            run/bus_real_data/approach2_ref_marker_graph_ba/07_run_ref_marker_graph_ba_distortion.py \
            run/bus_real_data/approach2_ref_marker_graph_ba/09_validate_ap02_solution_without_gt.py \
            run/bus_real_data/approach3_targetless_colmap_aruco_scale/02_run_colmap_sparse_grouped.py

      - name: Validate shell syntax
        run: |
          bash -n run/bus_real_data/_shared/baseline/run_shared_preprocessing.sh
          bash -n run/bus_real_data/approach1_marker_direct_relay/run_approach1_full_pipeline.sh
          bash -n run/bus_real_data/approach2_ref_marker_graph_ba/run_approach2_full_pipeline.sh
          bash -n run/bus_real_data/approach2_ref_marker_graph_ba/run_approach2_phase3_graph_ba_fast.sh
          bash -n run/bus_real_data/approach3_targetless_colmap_aruco_scale/02_run_colmap_sparse.sh
          bash -n run/bus_real_data/approach3_targetless_colmap_aruco_scale/run_approach3_full_pipeline.sh

      - name: Validate output contracts
        run: |
          grep -q "10_estimate_scale_from_marker_size_only.py" \
            run/bus_real_data/approach3_targetless_colmap_aruco_scale/run_approach3_full_pipeline.sh
          grep -q "AP03_MARKER_SIZE_SCALE_ONLY_STATIC_CAMERA_POSES.csv" \
            run/bus_real_data/approach3_targetless_colmap_aruco_scale/run_approach3_full_pipeline.sh
          grep -q "09_validate_ap02_solution_without_gt.py" \
            run/bus_real_data/approach2_ref_marker_graph_ba/run_approach2_full_pipeline.sh
          grep -q "07_run_ref_marker_graph_ba_distortion.py" \
            run/bus_real_data/approach2_ref_marker_graph_ba/run_approach2_phase3_graph_ba_fast.sh
          test -z "$(find run -type f -name '*.bak*' -print -quit)"
