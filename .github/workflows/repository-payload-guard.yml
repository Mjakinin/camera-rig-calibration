name: Repository payload guard

on:
  push:
  pull_request:

jobs:
  repository-payload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository without downloading LFS
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate regular Git and LFS payload policy
        run: python3 run/check_repository_payload.py
