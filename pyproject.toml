[build-system]
requires = ["setuptools>=69,<80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-rig-calibration"
version = "0.2.0"
description = "Reproducible command-line workflows for arbitrary camera-rig calibration"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "rich<15,>=13",
  "typer<1,>=0.12",
]

[project.optional-dependencies]
scientific = [
  "numpy>=1.26,<2",
  "scipy>=1.14,<2",
]
standalone = [
  "opencv-contrib-python-headless>=4.5,<5",
]
dev = [
  "build>=1.2,<2",
  "pytest>=7,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
rigcal = "camera_rig_calibration.product_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["camera_rig_calibration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: exercises multiple rigcal subsystems",
  "slow: requires large local data or long-running external tools",
  "requires_colmap: requires a COLMAP executable",
  "requires_ros: requires a sourced ROS 2 environment",
]
