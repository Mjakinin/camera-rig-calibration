schema_version: 5
project:
  workspace_root: ../workspace
  dataset_cache_root: ../workspace/preparation_cache
  output_root: ../results
  experiment_id: simulation_bus_route2_baseline
  run_label: baseline
dataset:
  id: simulation_bus_route2_baseline
  category: simulation
  source_kind: prepared
  scene_type: simulation
static_cameras:
  - id: cam_edge_0
    image_topic: /bus_real_data/cam_edge_0/image
    camera_info_topic: /bus_real_data/cam_edge_0/camera_info
  - id: cam_edge_1
    image_topic: /bus_real_data/cam_edge_1/image
    camera_info_topic: /bus_real_data/cam_edge_1/camera_info
  - id: cam_edge_3
    image_topic: /bus_real_data/cam_edge_3/image
    camera_info_topic: /bus_real_data/cam_edge_3/camera_info
  - id: cam_edge_5
    image_topic: /bus_real_data/cam_edge_5/image
    camera_info_topic: /bus_real_data/cam_edge_5/camera_info
moving_camera:
  id: moving_calib_camera
  image_topic: /bus_real_data/moving_calib_camera/image
  camera_info_topic: /bus_real_data/moving_calib_camera/camera_info
simulation:
  enabled: true
  preset: bus_baseline
  world: ../src/calib_lab/bus_real_data/worlds/bus_real_data_moving_camera.sdf
  route: ../src/calib_lab/bus_real_data/config/moving_camera_route2_interpolated_final.json
  moving_model_name: moving_calib_camera
  route_name: route2
  moving_width: 1280
  moving_height: 720
  moving_hfov_deg: 69.1
  lighting: baseline
  lighting_scale: 1.0
  motion_blur_kernel: 0
  motion_blur_angle_deg: 0.0
  target_route_frames: 189
  route_sampling_strategy: original_route_poses
  settle_seconds: 0.35
  post_pose_skip: 5
  frame_timeout_seconds: 3.0
  startup_timeout_seconds: 60.0
markers:
  dictionary: DICT_4X4_50
  length_m: 0.17
  accepted_ids: all_detected
selection:
  mode: auto
colmap:
  executable: auto
  matcher: exhaustive
  gpu_mode: auto
methods:
  enabled: [ap03]
  ap03:
    single:
      scale_marker_id: auto
    multi:
      marker_ids: auto
    scale:
      reprojection_threshold_px: 5.0
      ransac_iterations: 1000
      minimum_inliers: 4
      maximum_observations_per_marker: null
observation_quality:
  maximum_pnp_reprojection_error_px: 25.0
  minimum_marker_area_ratio: 0.000008
  require_positive_depth: true
  maximum_marker_distance_m: disabled
evaluation:
  enabled: true
  anchor_marker_id: auto
