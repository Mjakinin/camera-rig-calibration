schema_version: 5
project:
  workspace_root: ../workspace
  dataset_cache_root: ../workspace/preparation_cache
  output_root: ../results
  experiment_id: vehicle_exterior_day_01
  run_label: baseline
dataset:
  id: vehicle_exterior_day_01
  category: real_vehicle
  source_kind: video
  scene_type: exterior
  input_root: /absolute/path/to/recording
static_cameras:
  - id: front_left
    images: [/absolute/path/to/front_left.png]
    intrinsics: /absolute/path/to/front_left_intrinsics.json
  - id: front_right
    images: [/absolute/path/to/front_right.png]
    intrinsics: /absolute/path/to/front_right_intrinsics.json
  - id: rear
    images: [/absolute/path/to/rear.png]
    intrinsics: /absolute/path/to/rear_intrinsics.json
moving_camera:
  id: calibration_camera
  video: /absolute/path/to/moving_camera.mp4
  intrinsic_calibration_video: /absolute/path/to/checkerboard.mp4
  checkerboard_columns: 8
  checkerboard_rows: 6
sampling:
  target_hz: 3.0
markers:
  dictionary: DICT_4X4_50
  length_m: 0.17
  accepted_ids: all_detected
  detection_mode: baseline
selection:
  mode: auto
colmap:
  executable: auto
  matcher: exhaustive
  compute_mode: cpu_baseline
  maximum_image_size: 1600
  maximum_features: 4096
  mapper_minimum_matches: 8
methods:
  enabled: [ap01, ap02, ap03]
  ap01:
    method_contract: baseline_v1
    direct_target_camera: auto
    root_camera: auto
    top_moving_per_marker: 8
    scale_top_per_marker: 30
  ap02:
    method_contract: baseline_v1
    # In auto mode an integer is a category preference, not a hard requirement.
    # Marker 0 is used when it has automatic-quality support; otherwise preflight
    # falls back to the deterministic AP02 recommendation.
    reference_marker_selection_mode: auto
    reference_marker_id: 0
    frame_selection_strategy: smart_v1
    initialization_strategy: maximum_frontier_v1
    graph_edge_weight_strategy: geometric_observation_quality_v1
    reprojection_model: pinhole_v1
    reference_marker_maximum_frames: null
    top_per_marker: 8
    top_per_marker_pair: 4
    maximum_total_frames: null
    # Static BA already converges comfortably below 80 on the validated real run.
    # Combined BA uses 160 only as a safety ceiling and still terminates earlier
    # through the solver's ftol/xtol/gtol convergence conditions.
    static_only_ba_max_function_evaluations: 80
    combined_ba_max_function_evaluations: 160
    ba_robust_loss: soft_l1
    ba_robust_loss_scale_px: 3.0
  ap03:
    method_contract: baseline_v1
    feature_limit_policy: colmap_defaults_v1
    scale_input_policy: registered_image_redetection_v1
    minimum_marker_area_px2: 100.0
    single:
      # Category-default preference; marker 0 falls back to AP03 auto selection
      # when it has insufficient repeated moving support.
      scale_marker_id: 0
    multi:
      marker_ids: auto
    scale:
      reprojection_threshold_px: 5.0
      ransac_iterations: 1000
      minimum_inliers: 4
      maximum_observations_per_marker: null
observation_quality:
  maximum_pnp_reprojection_error_px: 25.0
  minimum_marker_area_ratio: 0.000008
  require_positive_depth: true
  maximum_marker_distance_m: disabled
evaluation:
  enabled: true
  # Auto + integer means preferred common anchor with deterministic auto fallback.
  anchor_marker_id: 0
  anchor_selection_mode: auto
