schema_version: 1
id: my_world
display_name: My Gazebo calibration world
sdf: ../../path/to/world.sdf
resource_paths:
  - ../../path/to/models
static_cameras:
  - id: static_front
    model_name: static_front
    sensor_name: static_front_sensor
    image_topic: /static_front/image
    camera_info_topic: /static_front/camera_info
moving_camera:
  id: calibration_camera
  model_name: calibration_camera
  sensor_name: calibration_camera_sensor
  image_topic: /calibration_camera/image
  camera_info_topic: /calibration_camera/camera_info
routes:
  - id: baseline_route
    path: ../../path/to/route.json
    baseline: true
capabilities:
  - route
  - density
  - resolution
  - fov
  - motion_blur
  - capture
